<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/css/exRegisterEnglish.css" />
    <title>Document</title>
  </head>
  <body>
    <section class="sectionPart">
      <!-------------------------------------------------------------------->
      <div>
        <h1>--------------Register--------------</h1>
        <h4>Create your account.It's free and only takes a minute</h4>
      </div>
      <!-------------------------------------------------------------------->
      <form class="formSection">
        <div class="halfLineInput">
          <input type="text" placeholder="First Name" required />
        </div>
        <div class="halfLineInput">
          <input type="text" placeholder="Last Name"  required/>
        </div>
        <!-------------------------------------------------------------------->
        <div class="fullLineInput">
          <input type="email" placeholder="Email" required />
        </div>
        <div class="fullLineInput">
          <input type="password" placeholder="Password"  require/>
        </div>
        <div class="fullLineInput">
          <input type="password" placeholder="Confirm password" required />
        </div>
        <!-------------------------------------------------------------------->
        <div class="checkboxSection">
          <input class="checkbox" type="checkbox" />
          <label
            >I accept the <span>Term Of Use</span> &
            <span>Privacy Policy</span></label
          >
        </div>
        <!-------------------------------------------------------------------->
        <div><button type="submit">Register Now</button></div>
      </form>

    </section>
    <div>
      <h4>Alredy have an account? <ins>Sign in</ins></h4>
    </div>
  </body>
</html>
