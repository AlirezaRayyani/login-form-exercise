<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/css/exRegisterPersian.css" />
    <title>Document</title>
  </head>
  <body>
    <section class="sectionPart">
      <!-------------------------------------------------------------------->
      <div>
        <!-- <h1>--------------Register--------------</h1> -->
        <h1>--------------ثبت نام کنید--------------</h1>
        <h4>
          حساب کاربری خود را ایجاد کنید. این رایگان است و فقط یک دقیقه طول می
          کشد
        </h4>
      </div>
      <!-------------------------------------------------------------------->
      <form class="formSection">
        <div class="halfLineInput">
          <input type="text" placeholder="نام" required />
        </div>
        <div class="halfLineInput">
          <input type="text" placeholder="نام خانوادگی" required />
        </div>
        <!-------------------------------------------------------------------->
        <div class="fullLineInput">
          <input type="email" placeholder="ایمیل" required />
        </div>
        <div class="fullLineInput">
          <input type="password" placeholder="گذرواژه" require />
        </div>
        <div class="fullLineInput">
          <input type="password" placeholder="تایید گذرواژه" required />
        </div>
        <!-------------------------------------------------------------------->
        <div class="checkboxSection">
          <input class="checkbox" type="checkbox" />
          <label
            >من <span>شرایط استفاده </span> و
            <span> سیاست حفط حریم خصوصی</span> را میپذیرم</label
          >
        </div>
        <!-------------------------------------------------------------------->
        <div><button type="submit">اکنون ثبت نام کنید</button></div>
      </form>
    </section>
    <div>
      <h4> قبلا یک حساب کاربری داشته اید؟ <ins>وارد شود</ins></h4>
    </div>
  </body>
</html>
